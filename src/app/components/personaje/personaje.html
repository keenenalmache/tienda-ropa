<div class="escena">
  <div class="pila">
    @if (frase()) {
      <div class="globo" role="status">
        @for (f of [frase()]; track f) {
          <span>{{ f }}</span>
        }
      </div>
    }
    <figure class="marco">
      <div class="foto">
        <img class="dia" [src]="srcDia()" alt="" />
        <img class="noche" [src]="src()" alt="" />
      </div>
    </figure>
  </div>
</div>
